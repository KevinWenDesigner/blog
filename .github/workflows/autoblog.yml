name: Autoblog from YouTube

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only generate previews and reports
        required: false
        type: boolean
        default: true
      max_videos:
        description: Maximum number of new videos to process
        required: false
        default: '3'

permissions:
  contents: write

jobs:
  autoblog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Run autoblog pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AUTOBLOG_OPENAI_MODEL: ${{ vars.AUTOBLOG_OPENAI_MODEL || 'gpt-4o-mini' }}
          AUTOBLOG_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          AUTOBLOG_MAX_VIDEOS: ${{ github.event.inputs.max_videos || '3' }}
        run: npm run autoblog

      - name: Upload autoblog artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoblog-report
          path: .autoblog
          include-hidden-files: true

      - name: Append job summary
        if: always()
        run: |
          if [ -f .autoblog/summary.md ]; then
            cat .autoblog/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit generated posts
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/blog
          if git diff --cached --quiet; then
            echo "No generated posts to commit"
            exit 0
          fi
          git commit -m "feat: autoblog publish YouTube notes"
          git push
